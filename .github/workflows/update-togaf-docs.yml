name: Update TOGAF Documentation in Wiki

on:
  push:
    branches: [ master ]
    paths:
      - 'TOGAF/architecture_documentation.md'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual trigger'

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: 'master'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Update TOGAF documentation in wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the current date in ISO format
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Create a temporary directory
          mkdir -p /tmp/wiki
          
          # Clone the wiki repository
          git clone https://$GITHUB_ACTOR:$GITHUB_TOKEN@github.com/ethpar/dora.par.wiki.git /tmp/wiki
          
          # Copy the TOGAF documentation
          cp TOGAF/architecture_documentation.md /tmp/wiki/TOGAF-Documentation.md
          
          # Update the last updated timestamp
          sed -i "s/<!-- AUTO-UPDATED -->/$DATE/g" /tmp/wiki/TOGAF-Documentation.md
          
          # Commit and push changes
          cd /tmp/wiki
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add TOGAF-Documentation.md
          
          # Only commit if there are changes
          if ! git diff --cached --exit-code; then
            git commit -m "docs: update TOGAF documentation"
            git push
            echo "✅ Wiki updated successfully"
          else
            echo "ℹ️ No changes to commit"
          fi

      - name: Update wiki in this repository
        run: |
          # Create docs/wiki directory if it doesn't exist
          mkdir -p docs/wiki
          
          # Update the local copy of the wiki in docs/wiki
          cp TOGAF/architecture_documentation.md docs/wiki/TOGAF-Documentation.md
          
          # Update the last updated timestamp
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          sed -i "s/<!-- AUTO-UPDATED -->/$DATE/g" docs/wiki/TOGAF-Documentation.md
          
          # Add and commit the changes
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/wiki/TOGAF-Documentation.md
          
          # Only commit if there are changes
          if ! git diff --cached --exit-code; then
            git commit -m "docs: update TOGAF documentation in wiki"
            git push
            echo "✅ Wiki in main repo updated successfully"
          else
            echo "ℹ️ No changes to commit to main repo"
          fi
