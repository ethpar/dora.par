{{ define "page" }}
<div class="container mt-2" id="frontpage_container">
    {{ template "addressOverview" . }}

    <ul class="nav nav-tabs justify-content-start mt-3" id="tab" role="tablist">
        <li class="nav-item">
            <a class="nav-link active" id="transactions-tab" data-bs-toggle="tab" href="#addressTransactions" role="tab" aria-controls="overview" aria-selected="true">Transactions</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="transactions-erc20-tab" data-bs-toggle="tab" href="#addressTransactionsErc20" role="tab" aria-controls="ddressTransactionsErc20" aria-selected="false">ERC-20 Transactions</a>
        </li>
    </ul>
    <div class="tab-content" id="tabContent">
        <div class="tab-pane fade show active" id="addressTransactions" role="tabpanel" aria-labelledby="transactions-tab">
            <div class="card block-card">
                {{ template "addressTransactions" . }}
            </div>
        </div>
        <div class="tab-pane fade show active" id="addressTransactionsErc20" role="tabpanel" aria-labelledby="transactions-erc20-tab">
            <div class="card block-card">
                {{ template "addressTransactionsErc20" . }}
            </div>
        </div>
    </div>
    <script type="text/javascript">
        Array.prototype.forEach.call(document.getElementById("tabContent").querySelectorAll(".tab-pane"), function(paneEl, paneIdx) {
            if(paneIdx > 0) {
                paneEl.classList.remove("active");
                paneEl.classList.remove("show");
            }
        });
        $(function() {
            if(location.hash)
                $('.nav-tabs a[href="' + location.hash + '"]').tab('show');
        });
    </script>

</div>
{{ end }}
{{ define "js" }}
<script src="/js/knockout.min.js"></script>

{{ end }}
{{ define "css" }}
<link rel="stylesheet" href="/css/forkgraph.css" />
<style>
    #recent-epochs, #recent-blocks, #recent-slots {
        margin-bottom: 0;
    }
    .startpage-panel .card-header {
        padding-top: 2px;
        padding-bottom: 2px;
    }
    .startpage-panel .card-header i {
        margin-right: 5px;
    }
</style>
{{ end }}
